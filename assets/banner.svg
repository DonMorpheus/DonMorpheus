  <rect x="868" y="88" width="4" height="212" fill="#9b2d22"/>

  <text x="892" y="118" fill="#8a7360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="3">OPERATIONS</text>

  <circle cx="900" cy="150" r="4" fill="#c44536"/>
  <text x="918" y="155" fill="#ead9c4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">Custom BOFs</text>

  <circle cx="900" cy="186" r="4" fill="#c44536"/>
  <text x="918" y="191" fill="#ead9c4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">C2 software &amp; infra</text>

  <circle cx="900" cy="222" r="4" fill="#c44536"/>
  <text x="918" y="227" fill="#ead9c4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">Operator kits</text>

  <circle cx="900" cy="258" r="4" fill="#c44536"/>
