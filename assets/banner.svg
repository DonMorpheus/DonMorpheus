<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="title desc">
  <title id="title">DonMorpheus — Red Team Hacker | C2 Operations &amp; OPSEC</title>
  <desc id="desc">Custom BOFs, C2 software and infrastructure, operator kits, 0-day research and exploit development.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#221a15"/>
      <stop offset="100%" stop-color="#100c0a"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4563a"/>
      <stop offset="100%" stop-color="#6e1f18"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.15" y1="0" x2="0.15" y2="1">
      <stop offset="0%" stop-color="#c44536" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#c44536" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#glow)"/>
  <rect x="0" y="0" width="14" height="340" fill="url(#spine)"/>
  <rect x="14" y="0" width="1" height="340" fill="#e07040" opacity="0.55"/>

  <text x="48" y="48" fill="#8a7360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="4.5">OPERATOR</text>
  <text x="1232" y="48" fill="#8a7360" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="3.2" text-anchor="end">AUTHORIZED LAB</text>
  <line x1="48" y1="64" x2="1232" y2="64" stroke="#3d2e24" stroke-width="1"/>

  <text x="48" y="148" fill="#ead9c4" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700">DonMorpheus</text>
  <text x="48" y="196" fill="#d4563a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" letter-spacing="0.6">Red Team Hacker  |  C2 Operations &amp; OPSEC</text>

  <text x="48" y="252" fill="#c4b09a" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="16">Custom BOFs. C2 we operate. Exploits we owe to a crash.</text>
  <text x="48" y="282" fill="#8a7360" font-family="ui-sans-serif, system-ui, Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Most of the tree stays private. What is public is enough to judge the work.</text>

  <!-- operations roster -->
